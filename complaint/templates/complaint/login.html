{% extends 'complaint/base.html' %}

{% block title %}Login | SmartResolve{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-sm-10 col-md-8 col-lg-5">
        <div class="card card-glass shadow-lg border-0">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-2">Welcome Back</h2>
                <p class="text-center text-muted mb-5 fs-7">Log in to manage your complaints and check updates</p>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="id_username" class="form-label fw-semibold text-light fs-7">Username</label>
                        <input type="text" name="username" id="id_username" required placeholder="Enter username" class="form-control py-2">
                    </div>
                    
                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold text-light fs-7">Password</label>
                        <input type="password" name="password" id="id_password" required placeholder="Enter password" class="form-control py-2">
                    </div>
                    
                    <div class="d-grid gap-2 mt-5">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">Log In</button>
                    </div>
                    
                    <div class="text-center mt-4 fs-7 text-muted">
                        Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none text-primary fw-semibold">Sign Up</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
